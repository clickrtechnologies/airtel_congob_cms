<div class="d-flex flex-column min-vh-100">
  <app-header></app-header>

  <div class="container d-flex align-items-center justify-content-center flex-grow-1 bg-light">
    <div class="card p-4 shadow-lg rounded-4" style="width: 100%; max-width: 400px;">
      <div class="text-center mb-4">
        <h2 class="fw-bold">Login via OTP</h2>
        <p class="text-muted">Enter your email to receive an OTP</p>
      </div>

      <form (ngSubmit)="sendOtp()" *ngIf="!otpSent">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" [(ngModel)]="email" name="email" id="email" class="form-control rounded-3"
            placeholder="Enter your email" required />
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger py-1 small" role="alert">
          {{ errorMessage }}
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary rounded-3">Send OTP</button>
        </div>
      </form>

      <form (ngSubmit)="verifyOtp()" *ngIf="otpSent">
        <div class="mb-3">
          <label for="otp" class="form-label">OTP</label>
          <input type="text" [(ngModel)]="otp" name="otp" id="otp" class="form-control rounded-3"
            placeholder="Enter OTP" required />
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger py-1 small" role="alert">
          {{ errorMessage }}
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-success rounded-3">Verify OTP & Login</button>
        </div>
        <div class="mt-2 text-muted small">
          Didn't receive OTP? <button type="button" (click)="resendOtp()">Resend OTP</button>

        </div>
      </form>

    </div>
  </div>

  <app-footer></app-footer>
</div>
